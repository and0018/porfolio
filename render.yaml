services:
  - type: web
    name: vinicius-almeida-portfolio
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: SITE_URL
        sync: false
      # Postgres externo (Neon, Supabase, etc.). No Render Free o disco é
      # apagado a cada restart; o banco mantém projetos e imagens.
      - key: DATABASE_URL
        sync: false
