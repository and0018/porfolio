<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Página não encontrada — Vinicius Almeida</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --paper: #f4efe4;
        --ink: #17140f;
        --muted: #857d6f;
        --clay: #cf5730;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 32px;
        background: var(--paper);
        color: var(--ink);
        font-family: "Instrument Sans", Arial, sans-serif;
      }
      main { max-width: 760px; text-align: center; }
      .mark {
        width: 52px;
        height: 52px;
        margin: 0 auto 34px;
        display: grid;
        place-items: center;
        border-radius: 14px;
        background: var(--ink);
        color: var(--paper);
        font-family: "Instrument Serif", Georgia, serif;
        font-size: 22px;
      }
      p.kicker {
        margin: 0 0 16px;
        font-size: 10px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--muted);
      }
      h1 {
        margin: 0 0 18px;
        font-family: "Instrument Serif", Georgia, serif;
        font-weight: 400;
        font-size: clamp(42px, 9vw, 88px);
        line-height: 0.94;
        letter-spacing: -0.04em;
      }
      h1 em { color: var(--clay); font-style: italic; }
      p.sub {
        max-width: 44ch;
        margin: 0 auto 32px;
        font-size: 14px;
        line-height: 1.7;
        color: var(--muted);
      }
      .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
      a {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 13px 20px;
        border-radius: 999px;
        font-size: 13px;
        text-decoration: none;
        transition: transform 0.2s, background 0.2s;
      }
      a:hover { transform: translateY(-2px); }
      .primary { background: var(--ink); color: var(--paper); }
      .primary:hover { background: var(--clay); }
      .ghost { border: 1px solid rgba(23, 20, 15, 0.25); color: var(--ink); }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">VA</div>
      <p class="kicker">Erro 404</p>
      <h1>Essa página<br /><em>saiu de quadro.</em></h1>
      <p class="sub">
        O link que você tentou abrir não existe ou foi movido. Volte para a vitrine para ver os
        trabalhos mais recentes.
      </p>
      <div class="actions">
        <a class="primary" href="/">Voltar ao site <span>↗</span></a>
        <a class="ghost" href="/#contato">Falar comigo</a>
      </div>
    </main>
  </body>
</html>
