<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Página não encontrada — Vinicius Almeida</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <meta name="theme-color" content="#F2F1E9" />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500&family=Bricolage+Grotesque:opsz,wght@12..96,400..700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --paper: #f2f1e9;
        --paper-2: #e7e6da;
        --ink: #15170f;
        --ink-2: #3a3d30;
        --muted: #626553;
        --olive: #5e6547;
        --military: #2f3a2b;
        --line: rgba(21, 23, 15, 0.16);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 32px;
        background: var(--paper);
        color: var(--ink);
        font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
      }
      main { width: min(780px, 100%); }
      .topline {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: clamp(48px, 9vh, 92px);
        padding-bottom: 16px;
        border-bottom: 1px solid var(--line);
        font-size: 12px;
        color: var(--muted);
      }
      .mark {
        width: 40px;
        height: 40px;
        display: grid;
        place-items: center;
        background: var(--military);
        color: var(--paper);
        font-family: "Bricolage Grotesque", "Archivo", sans-serif;
        font-size: 16px;
        font-weight: 600;
        letter-spacing: -0.04em;
      }
      .topline span:last-child { margin-left: auto; }
      p.kicker {
        margin: 0 0 18px;
        font-size: 12px;
        color: var(--olive);
      }
      h1 {
        max-width: 15ch;
        margin: 0 0 24px;
        font-family: "Bricolage Grotesque", "Archivo", sans-serif;
        font-weight: 500;
        font-size: clamp(46px, 8.4vw, 92px);
        line-height: 0.92;
        letter-spacing: -0.055em;
      }
      h1 em { color: var(--olive); font-style: normal; }
      p.sub {
        max-width: 46ch;
        margin: 0 0 34px;
        font-size: 14px;
        line-height: 1.7;
        color: var(--ink-2);
      }
      .actions { display: flex; gap: 10px; flex-wrap: wrap; }
      a {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 14px 21px;
        font-size: 13px;
        font-weight: 500;
        text-decoration: none;
        transition: background 0.2s, color 0.2s, border-color 0.2s;
      }
      .primary { background: var(--military); color: var(--paper); }
      .primary:hover { background: var(--ink); }
      .ghost { border: 1px solid rgba(21, 23, 15, 0.32); color: var(--ink); }
      .ghost:hover { border-color: var(--ink); background: var(--paper-2); }
    </style>
  </head>
  <body>
    <main>
      <div class="topline">
        <div class="mark">VA</div>
        <span>Vinicius Almeida</span>
        <span>Erro 404</span>
      </div>

      <p class="kicker">Fora de quadro</p>
      <h1>Essa página<br /><em>saiu de quadro.</em></h1>
      <p class="sub">
        O link que você tentou abrir não existe ou foi movido. Volte para a vitrine para ver os
        trabalhos mais recentes.
      </p>
      <div class="actions">
        <a class="primary" href="/">Voltar ao site</a>
        <a class="ghost" href="/#contato">Falar comigo</a>
      </div>
    </main>
  </body>
</html>
